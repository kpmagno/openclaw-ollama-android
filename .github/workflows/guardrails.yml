name: Guardrails

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  content-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block likely secrets and personal infra identifiers
        shell: bash
        run: |
          set -euo pipefail

          # Common secret/token patterns.
          SECRET_PATTERNS='(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|eyJ[A-Za-z0-9._-]{20,}|rt_[A-Za-z0-9._-]{20,}|[0-9]{8,}:[A-Za-z0-9_-]{20,})'
          if rg -n --hidden -S "${SECRET_PATTERNS}" .; then
            echo "Blocked: likely secret detected."
            exit 1
          fi

          # Disallow committing obvious private key material.
          if rg -n --hidden -S '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' .; then
            echo "Blocked: private key material detected."
            exit 1
          fi

          echo "Guardrails check passed."
